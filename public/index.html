    </div>
   <div id="folio" class="swiper-container">
      <div class="swiper-wrapper h-swiper">
          <div class="swiper-slide" v-for="item in items">

<div class="xl:pb-24 xl:bg-transparent bg-white" data-aos="fade-up"> 
<div id="items" class="container mx-auto xl:mb-24">
    <form class="pt-10 pb-10 text-center">
        <h2 class="font-serif lg:text-5xl text-3xl font-bold xl:pb-4 pt-24">Emails</h2>
        <button class="highlight w-2/5 lg:w-auto mt-3 px-5 py-2 font-bold" @click.prevent="setStatus('')">All</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('animation')">Animation</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('newsletter')">Newsletter</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('transactional')">Transactional</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('promo')">Promo</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('event')">Event</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('carousel')">Carousel</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('countdown')">Countdown</button>
        <button class="highlight font-light py-2 px-4 xl:my-0 my-1" @click.prevent="setStatus('gamification')">Gamification</button>
    </form>
    
        <div class="flex flex-wrap ">
            <div class="lg:w-1/4 w-1/2 p-1" data-aos="fade" data-aos-duration="1000"
            v-for="item in items | filterBy search_filter in 'name' | filterBy status_filter in 'group'" 
            v-show="setPaginate($index)">
                <a target="_blank" :href="item.url"
                class="w-auto flex-grow flex flex-col justify-center text-black  h-70 lg:p-10 p-8 bg-cover bg-top relative overlay overlay-hover"  :style="{ 'background-image': 'url(' + item.img + ')' }">
                    <h1 class="text-white mb-8 mark-bold text-3xl leading-none relative z-10">
                        {{ item.name }}
                      </h1>
                    <div class="relative z-10 no-underline text-white font-light" target="_blank" :href="item.url">
                         View Email  <span class="text-xl">↬</span>
                    </div>
                </a>
            </div>
        </div>
</div>

              }
              else {

              }

              this.$nextTick(function () {
                this.updatePaginate();
              });
